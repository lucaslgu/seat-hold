[pytest]
markers =
    business: regras de negócio (hold/confirm/estados)
    timeout_ttl: timeouts e expiração via TTL
    performance: budget de latência (p50/p99)
    algorithmic: complexidade algorítmica (O(1) round-trips, concorrência)
    integration: integração com Redis e contratos HTTP
    standards: padrões (OpenAPI, documentação)
addopts = -m "not none"